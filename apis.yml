aid: radian-group
name: Radian Group
description: >-
  Radian Group Inc. (NYSE: RDN) is a global, multi-line specialty insurer
  providing private mortgage insurance through Radian Guaranty and specialty
  insurance through its Inigo subsidiary at Lloyd's of London. Additional
  subsidiaries include Radian Mortgage Capital and Radian Settlement Services.
  Radian sold its homegenius media business in 2024. The company does not
  publish a public developer portal or API documentation; lender integrations
  occur through partner loan-origination, pricing, and servicing systems.
  This repository captures what little machine-readable surface exists for
  Radian Group.
